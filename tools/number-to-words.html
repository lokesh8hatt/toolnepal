<body>
<div id="siteHeader"></div>
<main id="main" class="main">
  <div class="container">
    <section class="split">
      <div class="stack">
        <div class="card">
          <h1>Number to Words</h1>
          <p class="help">Convert numbers to words perfectly suited for Nepali numeric systems (Lakhs, Crores).</p>
          <div class="field" style="margin-top: 1.5rem">
            <label for="numInput">Enter Number</label>
            <input id="numInput" class="input" type="number" placeholder="e.g. 150000" oninput="tnConvertNumber()">
          </div>
          <div id="numOutput" style="margin-top: 1.5rem"></div>
        </div>
      </div>
      <aside class="sidebar">
        <div class="card help">Supports up to 999 Crores. Useful for accounting and billing in Nepal.</div>
      </aside>
    </section>
  </div>
</main>
<div id="siteFooter"></div>
<script src="../assets/js/main.js"></script>
<script>
  function tnConvertNumber() {
    const val = parseInt(document.getElementById("numInput").value);
    const out = document.getElementById("numOutput");
    if (isNaN(val)) { out.innerHTML = ""; return; }
    
    const units = ["","One","Two","Three","Four","Five","Six","Seven","Eight","Nine"];
    const tens = ["","Ten","Twenty","Thirty","Forty","Fifty","Sixty","Seventy","Eighty","Ninety"];
    const teens = ["Ten","Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen"];
    
    function convert(n) {
      if (n===0) return "Zero";
      if (n<10) return units[n];
      if (n<20) return teens[n-10];
      if (n<100) return tens[Math.floor(n/10)] + (n%10 !== 0 ? " " + units[n%10] : "");
      if (n<1000) return units[Math.floor(n/100)] + " Hundred" + (n%100 !== 0 ? " and " + convert(n%100) : "");
      if (n<100000) return convert(Math.floor(n/1000)) + " Thousand" + (n%1000 !== 0 ? " " + convert(n%1000) : "");
      if (n < 10000000) return convert(Math.floor(n / 100000)) + " Lakh" + (n % 100000 !== 0 ? " " + convert(n % 100000) : "");
      return convert(Math.floor(n / 10000000)) + " Crore" + (n % 10000000 !== 0 ? " " + convert(n % 10000000) : "");
    }
    
    const words = convert(val);
    out.innerHTML = `<div class="result"><strong>${words}</strong><button class="btn btn-ghost" style="margin-top:1rem;display:block" onclick="navigator.clipboard.writeText('${words}')">Copy</button></div>`;
  }
</script>
</body>
</html>
