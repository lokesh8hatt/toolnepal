<body>
<div id="siteHeader"></div>

<main class="main">

    <section class="split">

      <!-- MAIN TOOL -->
      <div class="card">
        <h1>Split PDF</h1>
        <p class="help">
          Extract specific pages from a PDF. Example: <b>1-3</b>, <b>5</b>, <b>2-4,7</b>
        </p>

        <div class="field">
          <label>Select PDF file</label>
          <input id="splitFile" class="input" type="file" accept="application/pdf">
        </div>

        <div class="field" style="margin-top:1rem">
          <label>Pages to extract</label>
          <input
            id="pageRange"
            class="input"
            placeholder="e.g. 1-3,5,7-9"
          >
          <div class="help">
            Pages start from 1 (not 0)
          </div>
        </div>

        <div class="row" style="margin-top:1rem">
          <button class="btn btn-primary" onclick="splitPdf()">Split PDF</button>
          <button class="btn btn-secondary" onclick="resetSplit()">Reset</button>
        </div>

<!-- PDF library -->
<script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
<script src="../../assets/js/main.js"></script>

<script>
function parsePageRange(range, totalPages) {
  const pages = new Set();

  range.split(",").forEach(part => {
    if (part.includes("-")) {
      const [start, end] = part.split("-").map(Number);
      for (let i = start; i <= end; i++) {
        if (i >= 1 && i <= totalPages) pages.add(i - 1);
      }
    } else {
      const p = Number(part);
      if (p >= 1 && p <= totalPages) pages.add(p - 1);
    }
  });

  return Array.from(pages);
}

async function splitPdf() {
  const fileInput = document.getElementById("splitFile");
  const rangeInput = document.getElementById("pageRange");
  const status = document.getElementById("splitStatus");

  if (!fileInput.files.length) {
    tnToast("Select a PDF file");
    return;
  }

  if (!rangeInput.value.trim()) {
    tnToast("Enter page range");
    return;
  }

  status.textContent = "Processing PDF...";

  try {
    const fileBytes = await fileInput.files[0].arrayBuffer();
    const srcPdf = await PDFLib.PDFDocument.load(fileBytes);
    const totalPages = srcPdf.getPageCount();

    const pageIndexes = parsePageRange(rangeInput.value, totalPages);

    if (!pageIndexes.length) {
      tnToast("Invalid page range");
      status.textContent = "";
      return;
    }

    const newPdf = await PDFLib.PDFDocument.create();
    const pages = await newPdf.copyPages(srcPdf, pageIndexes);
    pages.forEach(p => newPdf.addPage(p));

    const newBytes = await newPdf.save();
    const blob = new Blob([newBytes], { type: "application/pdf" });

    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "split-toolnepal.pdf";
    a.click();
    URL.revokeObjectURL(url);

    status.textContent = "Done!";
    tnToast("PDF split successfully");

  } catch (err) {
    console.error(err);
    tnToast("Failed to split PDF");
    status.textContent = "";
  }
}

function resetSplit() {
  document.getElementById("splitFile").value = "";
  document.getElementById("pageRange").value = "";
  document.getElementById("splitStatus").textContent = "";
}
</script>
